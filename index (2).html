function hashCode(s) {
  let h = 0;
  for (let i = 0; i < s.length; i++) h = ((h << 5) - h + s.charCodeAt(i)) | 0;
  return Math.abs(h);
}

function getStats(tfg) {
  const seed = hashCode(tfg.ref);
  const rand = (off, max) => ((seed * (off + 1)) % 100) * (max / 100);
  const t = tfg.titulo.toUpperCase();
  let bs = 30 + rand(1, 50), co = 40 + rand(2, 50), br = 30 + rand(3, 50), ch = 30 + rand(4, 50);
  let novia = 30 + rand(5, 50);  // probabilidad de quedarte sin novia
  let cope = 50 + rand(6, 40);   // copium

  if (t.includes('IA') || t.includes('INTELIGENCIA ARTIFICIAL')) { br += 25; bs += 15; co += 20; }
  if (t.includes('IPSEC') || t.includes('SECUR') || t.includes('CIFR')) { br += 20; co += 15; }
  if (t.includes('RESILIENCIA') || t.includes('COHESIÓN')) { bs += 45; br -= 20; ch += 30; novia -= 20; }
  if (t.includes('OPTIMIZ') || t.includes('EFICIENCIA') || t.includes('ESTANDAR')) { bs += 25; ch += 10; }
  if (t.includes('ESCOMBROS ESPACIAL')) { br += 30; bs -= 10; co += 25; }
  if (t.includes('LORA') || t.includes('SDR') || t.includes('KRAKEN')) { br += 15; co += 10; }
  if (t.includes('UCRANIA')) { bs += 10; br += 5; }
  if (t.includes('ANTENAS')) { br += 15; }
  if (t.includes('STANDARIZED') || t.includes('STANDAR')) { co += 20; bs += 20; }

  // ciudad afecta la "vida"
  const c = tfg.ciudad.toUpperCase();
  if (c.includes('LAS PALMAS')) { ch += 35; novia += 20; }
  if (c.includes('CEUTA') || c.includes('MELILLA')) { ch -= 25; novia -= 15; }
  if (c.includes('ZARAGOZA')) { ch += 15; novia += 25; }
  if (c.includes('CÓRDOBA') || c.includes('BADAJOZ') || c.includes('ALMER')) { ch -= 10; }
  if (c.includes('MADRID')) { ch += 15; }
  if (c.includes('PARACUELLOS')) { ch -= 20; co += 15; }
  if (c.includes('HUESCA')) { ch -= 5; }
  if (c.includes('PONTEVEDRA')) { ch -= 10; }

  const cap = v => Math.max(5, Math.min(99, Math.round(v)));
  return {
    bullshit: cap(bs),
    coffee: cap(co),
    brain: cap(br),
    chill: cap(ch),
    novia: cap(novia),
    cope: cap(cope)
  };
}

function getCityVibe(c) {
  c = c.toUpperCase();
  if (c.includes('CEUTA')) return { e: '🌊', t: 'CHIRINGUITO + AISLAMIENTO' };
  if (c.includes('MELILLA')) return { e: '🛳️', t: 'FERRY 4H A LA PENI' };
  if (c.includes('LAS PALMAS')) return { e: '🏝️', t: 'EL JACKPOT' };
  if (c.includes('MADRID')) return { e: '🍻', t: 'CAÑAS Y METRO' };
  if (c.includes('ZARAGOZA')) return { e: '🏠', t: 'CASA DE MAMÁ' };
  if (c.includes('HUESCA')) return { e: '🐄', t: 'MÁS VACAS QUE WIFI' };
  if (c.includes('CÓRDOBA')) return { e: '🥵', t: '47 GRADOS A LA SOMBRA' };
  if (c.includes('PONTEVEDRA')) return { e: '🌧️', t: 'LLUVIA Y SAUDADE' };
  if (c.includes('BADAJOZ')) return { e: '🐷', t: 'EXTREMA-DURA' };
  if (c.includes('ALMER')) return { e: '🏜️', t: 'FAR WEST DESERT' };
  if (c.includes('PARACUELLOS')) return { e: '🪂', t: 'TIRARSE DE AVIONES' };
  if (c.includes('MARINES')) return { e: '🍊', t: 'NARANJAS Y SUSTOS' };
  return { e: '📍', t: 'UBICACIÓN MISTERIOSA' };
}

let state = {
  index: 0,
  matches: [],
  rejected: [],
  dragX: 0,
  dragY: 0,
  isDragging: false,
  startX: 0,
  startY: 0,
  animating: false
};

const stack = document.getElementById('stack');
const counter = document.getElementById('counter');
const actions = document.getElementById('actions');
const help = document.getElementById('help');

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function buildCardHTML(tfg, isTop) {
  const stats = getStats(tfg);
  const vibe = getCityVibe(tfg.ciudad);
  return `
    <div class="card-header">
      <div class="badge-row">
        <span class="ref-badge">${tfg.ref}</span>
        <span class="vibe-emoji">${vibe.e}</span>
      </div>
      <div class="city-row">
        📍 ${escapeHtml(tfg.ciudad)} <span class="city-tag">${vibe.t}</span>
      </div>
      <div class="unidad">${escapeHtml(tfg.unidad)}${tfg.brigada ? ' · ' + escapeHtml(tfg.brigada) : ''}</div>
      <div class="roast-tag">🎯 ${escapeHtml(tfg.roastTag)}</div>
      ${isTop ? '<div class="stamp like">¡SÍ!</div><div class="stamp nope">NOPE</div>' : ''}
    </div>
    <div class="card-body">
      <h2 class="card-title">${escapeHtml(tfg.titulo)}</h2>
      <div class="roast-quote">💬 "${escapeHtml(tfg.roastQuote)}"</div>
      <div class="director-row">
        👤 <span><strong>${escapeHtml(tfg.empleo || 'OFICIAL')}</strong> ${escapeHtml(tfg.director)}</span>
      </div>
      <div class="stats-title">📊 LO QUE TE ESPERA</div>
      <div class="stat"><span class="stat-icon">🧠</span><span class="stat-label">SUSTANCIA REAL</span><div class="stat-bar"><div class="stat-fill" style="width:${stats.brain}%;background:#8b5cf6"></div></div><span class="stat-value">${stats.brain}%</span></div>
      <div class="stat"><span class="stat-icon">💀</span><span class="stat-label">PAJA / RELLENO</span><div class="stat-bar"><div class="stat-fill" style="width:${stats.bullshit}%;background:#dc2626"></div></div><span class="stat-value">${stats.bullshit}%</span></div>
      <div class="stat"><span class="stat-icon">☕</span><span class="stat-label">CAFÉS NECESARIOS</span><div class="stat-bar"><div class="stat-fill" style="width:${stats.coffee}%;background:#a16207"></div></div><span class="stat-value">${stats.coffee}%</span></div>
      <div class="stat"><span class="stat-icon">💔</span><span class="stat-label">RIESGO RUPTURA</span><div class="stat-bar"><div class="stat-fill" style="width:${stats.novia}%;background:#ec4899"></div></div><span class="stat-value">${stats.novia}%</span></div>
      <div class="stat"><span class="stat-icon">✨</span><span class="stat-label">VIDA SOCIAL</span><div class="stat-bar"><div class="stat-fill" style="width:${stats.chill}%;background:#10b981"></div></div><span class="stat-value">${stats.chill}%</span></div>
    </div>
  `;
}

function render() {
  if (state.index >= TFGS.length) {
    renderFinished();
    return;
  }

  const cards = stack.querySelectorAll('.card');
  const expected = Math.min(3, TFGS.length - state.index);
  const topRef = TFGS[state.index].ref;
  const currentTopCard = stack.querySelector('.card.top');
  const needRebuild = cards.length !== expected || !currentTopCard || currentTopCard.dataset.ref !== topRef;

  if (needRebuild) {
    stack.innerHTML = '';
    for (let depth = 2; depth >= 0; depth--) {
      const t = TFGS[state.index + depth];
      if (!t) continue;
      const card = document.createElement('div');
      card.className = 'card' + (depth === 0 ? ' top' : '');
      card.dataset.ref = t.ref;
      card.dataset.depth = depth;
      const scale = 1 - depth * 0.04;
      const ty = depth * 10;
      card.style.transform = `translate(0px, ${ty}px) scale(${scale})`;
      card.innerHTML = buildCardHTML(t, depth === 0);
      stack.appendChild(card);
    }
    attachDragHandlers();
  }

  counter.textContent = `${state.index + 1}/${TFGS.length}`;
  actions.classList.remove('hidden');
  help.classList.remove('hidden');
}

function attachDragHandlers() {
  const top = stack.querySelector('.card.top');
  if (!top) return;
  top.addEventListener('mousedown', onStart);
  top.addEventListener('touchstart', onStart, { passive: false });
}

function onStart(e) {
  if (state.animating) return;
  e.preventDefault();
  const p = e.touches ? e.touches[0] : e;
  state.isDragging = true;
  state.startX = p.clientX;
  state.startY = p.clientY;
  state.dragX = 0;
  state.dragY = 0;
  const top = stack.querySelector('.card.top');
  if (top) top.classList.add('dragging');
}

function onMove(e) {
  if (!state.isDragging) return;
  const p = e.touches ? e.touches[0] : e;
  state.dragX = p.clientX - state.startX;
  state.dragY = p.clientY - state.startY;
  const top = stack.querySelector('.card.top');
  if (!top) return;
  const rot = state.dragX * 0.08;
  const op = 1 - Math.min(Math.abs(state.dragX) / 400, 0.3);
  top.style.transform = `translate(${state.dragX}px, ${state.dragY}px) rotate(${rot}deg)`;
  top.style.opacity = op;
  const like = top.querySelector('.stamp.like');
  const nope = top.querySelector('.stamp.nope');
  if (like) like.style.opacity = state.dragX > 50 ? 1 : 0;
  if (nope) nope.style.opacity = state.dragX < -50 ? 1 : 0;
}

function onEnd() {
  if (!state.isDragging) return;
  state.isDragging = false;
  const top = stack.querySelector('.card.top');
  if (top) top.classList.remove('dragging');
  if (state.dragX > 100) doSwipe('like');
  else if (state.dragX < -100) doSwipe('nope');
  else {
    if (top) {
      top.classList.add('animating');
      top.style.transform = `translate(0,0) rotate(0)`;
      top.style.opacity = 1;
      const like = top.querySelector('.stamp.like');
      const nope = top.querySelector('.stamp.nope');
      if (like) like.style.opacity = 0;
      if (nope) nope.style.opacity = 0;
      setTimeout(() => { if (top) top.classList.remove('animating'); }, 300);
    }
    state.dragX = 0; state.dragY = 0;
  }
}

window.addEventListener('mousemove', onMove);
window.addEventListener('mouseup', onEnd);
window.addEventListener('touchmove', onMove, { passive: false });
window.addEventListener('touchend', onEnd);

function doSwipe(action) {
  if (state.animating) return;
  state.animating = true;
  const top = stack.querySelector('.card.top');
  const current = TFGS[state.index];
  if (top) {
    top.classList.add('animating');
    const dir = action === 'like' ? 1 : -1;
    top.style.transform = `translate(${dir * 600}px, ${state.dragY}px) rotate(${dir * 30}deg)`;
    top.style.opacity = 0;
  }
  setTimeout(() => {
    if (action === 'like') {
      state.matches.push(current);
      showMatchPopup(current);
    } else {
      state.rejected.push(current);
    }
    state.index++;
    state.dragX = 0; state.dragY = 0;
    state.animating = false;
    setTimeout(() => render(), action === 'like' ? 1900 : 50);
  }, 300);
}

function showMatchPopup(tfg) {
  const popup = document.createElement('div');
  popup.className = 'match-popup';
  popup.innerHTML = `
    <div class="match-box">
      <div class="match-emoji">💘</div>
      <div class="match-title">¡MATCH!</div>
      <div class="match-ref">${tfg.ref} · ${escapeHtml(tfg.ciudad)}</div>
      <div class="match-verdict">${escapeHtml(tfg.veredicto)}</div>
    </div>
  `;
  stack.appendChild(popup);
  setTimeout(() => popup.remove(), 1900);
}

function getFinalVerdict() {
  const m = state.matches;
  if (m.length === 0) return "🚫 Cero matches. Eres más exigente que tu suegra. O simplemente vas a repetir curso.";
  if (m.length >= 25) return "💀 25+ matches. ¿Eres NPC? Te asignarán el peor por ley de Murphy.";
  if (m.length === 1) return `🎯 UN solo match. Decisión tomada con la valentía de un samurái. O has fallado al deslizar 30 veces.`;

  const cities = m.map(t => t.ciudad);
  const hasLasPalmas = cities.some(c => c.includes('LAS PALMAS'));
  const hasCeutaMelilla = cities.some(c => c.includes('CEUTA') || c.includes('MELILLA'));
  const hasZaragoza = cities.some(c => c.includes('ZARAGOZA'));
  const onlyZaragoza = cities.every(c => c.includes('ZARAGOZA'));

  if (hasLasPalmas) return "🏝️ Has elegido Las Palmas. Tu motivación es la playa, no la transmisión. Te respeto.";
  if (onlyZaragoza) return "🏠 Solo Zaragoza. Mami va a estar muy orgullosa. Tu independencia: ninguna.";
  if (hasCeutaMelilla && !hasLasPalmas) return "🌊 Ceuta o Melilla en tu lista. Eres aventurero/a o inconsciente. La línea es fina.";
  if (hasZaragoza) return "🤝 Has incluido Zaragoza. Hedge inteligente. Te conoces a ti mismo/a.";

  const titles = m.map(t => t.titulo.toUpperCase()).join(' ');
  if (titles.includes('RESILIENCIA') || titles.includes('COHESIÓN')) return "💀 Has metido un TFG de pseudociencia. Te conoces. Vas al mínimo esfuerzo. Estratega.";
  if (titles.match(/IA|INTELIGENCIA ARTIFICIAL/)) return "🤖 IA por todas partes. Buena suerte explicando que ChatGPT no es 'investigación'.";

  return "🎲 Tu selección es… ecléctica. Que decidan los burócratas. Lo que te toque, te toca.";
}

function renderFinished() {
  const verdict = getFinalVerdict();
  stack.innerHTML = `
    <div class="finished">
      <div class="trophy">🏆</div>
      <h2>¡Has terminado!</h2>
      <div class="verdict">${verdict}</div>
      <p class="stats">${state.matches.length} matches · ${state.rejected.length} descartes</p>
      ${state.matches.length > 0 ? `
        <div class="matches-list">
          <div class="matches-title">💖 TUS MATCHES (Y EL DESTINO QUE TE ESPERA)</div>
          ${state.matches.map(m => `
            <div class="match-item">
              <div class="match-item-ref">${m.ref} · ${escapeHtml(m.ciudad)} · ${escapeHtml(m.roastTag)}</div>
              <div class="match-item-title">${escapeHtml(m.titulo)}</div>
            </div>
          `).join('')}
        </div>
      ` : ''}
      <button class="restart-btn" id="restartBtn">↻ EMPEZAR DE NUEVO</button>
    </div>
  `;
  document.getElementById('restartBtn').addEventListener('click', resetApp);
  counter.textContent = `${TFGS.length}/${TFGS.length}`;
  actions.classList.add('hidden');
  help.classList.add('hidden');
}

function resetApp() {
  state = { index: 0, matches: [], rejected: [], dragX: 0, dragY: 0, isDragging: false, startX: 0, startY: 0, animating: false };
  render();
}

document.getElementById('btnLike').addEventListener('click', () => doSwipe('like'));
document.getElementById('btnNope').addEventListener('click', () => doSwipe('nope'));
document.getElementById('btnReset').addEventListener('click', resetApp);

render();
</script>
