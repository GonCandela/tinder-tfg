  .counter {

function hashCode(s) {
  let h = 0;
  for (let i = 0; i < s.length; i++) h = ((h << 5) - h + s.charCodeAt(i)) | 0;
  return Math.abs(h);
}

function getStats(tfg) {
  const seed = hashCode(tfg.ref);
  const rand = (off, max) => ((seed * (off + 1)) % 100) * (max / 100);
  const t = tfg.titulo.toUpperCase();
  let bs = 30 + rand(1, 50), co = 40 + rand(2, 50), br = 30 + rand(3, 50), ch = 30 + rand(4, 50);
  if (t.includes('IA') || t.includes('INTELIGENCIA ARTIFICIAL')) { br += 25; bs += 15; }
  if (t.includes('IPSEC') || t.includes('SECUR') || t.includes('CIFR')) { br += 20; co += 15; }
  if (t.includes('RESILIENCIA') || t.includes('COHESIÓN')) { bs += 35; br -= 15; ch += 20; }
  if (t.includes('OPTIMIZ') || t.includes('EFICIENCIA') || t.includes('ESTANDAR')) { bs += 20; ch += 10; }
  if (t.includes('ESCOMBROS ESPACIAL')) { br += 30; bs -= 10; }
  if (t.includes('LORA') || t.includes('SDR') || t.includes('KRAKEN')) { br += 20; co += 10; }
  if (t.includes('UCRANIA')) { bs += 10; br += 5; }
  if (t.includes('ANTENAS')) { br += 15; }
  if (t.includes('STANDARIZED') || t.includes('STANDAR')) { co += 20; }
  const cap = v => Math.max(5, Math.min(99, Math.round(v)));
  return { bullshit: cap(bs), coffee: cap(co), brain: cap(br), chill: cap(ch) };
}

}

      </div>
      <div class="stats-title">📊 ESTADÍSTICAS BRUTALES</div>
      <div class="stat"><span class="stat-icon">🧠</span><span class="stat-label">CRITERIO</span><div class="stat-bar"><div class="stat-fill" style="width:${stats.brain}%;background:#8b5cf6"></div></div><span class="stat-value">${stats.brain}%</span></div>
      <div class="stat"><span class="stat-icon">☕</span><span class="stat-label">CAFEÍNA</span><div class="stat-bar"><div class="stat-fill" style="width:${stats.coffee}%;background:#a16207"></div></div><span class="stat-value">${stats.coffee}%</span></div>
      <div class="stat"><span class="stat-icon">💀</span><span class="stat-label">PAJA</span><div class="stat-bar"><div class="stat-fill" style="width:${stats.bullshit}%;background:#dc2626"></div></div><span class="stat-value">${stats.bullshit}%</span></div>
      <div class="stat"><span class="stat-icon">✨</span><span class="stat-label">VIDA</span><div class="stat-bar"><div class="stat-fill" style="width:${stats.chill}%;background:#10b981"></div></div><span class="stat-value">${stats.chill}%</span></div>
    </div>
  `;
}

function render() {
  if (state.index >= TFGS.length) {
    renderFinished();
    return;
  }

  const cards = stack.querySelectorAll('.card');
  const expected = Math.min(3, TFGS.length - state.index);
  const topRef = TFGS[state.index].ref;
  const currentTopCard = stack.querySelector('.card.top');
  const needRebuild = cards.length !== expected || !currentTopCard || currentTopCard.dataset.ref !== topRef;

  if (needRebuild) {
    stack.innerHTML = '';
    for (let depth = 2; depth >= 0; depth--) {
      const t = TFGS[state.index + depth];
      if (!t) continue;
      const card = document.createElement('div');
      card.className = 'card' + (depth === 0 ? ' top' : '');
      card.dataset.ref = t.ref;
      card.dataset.depth = depth;
      const scale = 1 - depth * 0.04;
      const ty = depth * 10;
      card.style.transform = `translate(0px, ${ty}px) scale(${scale})`;
      card.innerHTML = buildCardHTML(t, depth === 0);
      stack.appendChild(card);
    }
    attachDragHandlers();
  }

  counter.textContent = `${state.index + 1}/${TFGS.length}`;
  actions.classList.remove('hidden');
  help.classList.remove('hidden');
}

function attachDragHandlers() {
  const top = stack.querySelector('.card.top');
  if (!top) return;
  top.addEventListener('mousedown', onStart);
  top.addEventListener('touchstart', onStart, { passive: false });
}

function onStart(e) {
  if (state.animating) return;
  e.preventDefault();
  const p = e.touches ? e.touches[0] : e;
  state.isDragging = true;
  state.startX = p.clientX;
  state.startY = p.clientY;
  state.dragX = 0;
  state.dragY = 0;
  const top = stack.querySelector('.card.top');
  if (top) top.classList.add('dragging');
}

function onMove(e) {
  if (!state.isDragging) return;
  const p = e.touches ? e.touches[0] : e;
  state.dragX = p.clientX - state.startX;
  state.dragY = p.clientY - state.startY;
  const top = stack.querySelector('.card.top');
  if (!top) return;
  const rot = state.dragX * 0.08;
  const op = 1 - Math.min(Math.abs(state.dragX) / 400, 0.3);
  top.style.transform = `translate(${state.dragX}px, ${state.dragY}px) rotate(${rot}deg)`;
  top.style.opacity = op;
  const like = top.querySelector('.stamp.like');
  const nope = top.querySelector('.stamp.nope');
  if (like) like.style.opacity = state.dragX > 50 ? 1 : 0;
  if (nope) nope.style.opacity = state.dragX < -50 ? 1 : 0;
}

function onEnd() {
  if (!state.isDragging) return;
  state.isDragging = false;
  const top = stack.querySelector('.card.top');
  if (top) top.classList.remove('dragging');
  if (state.dragX > 100) doSwipe('like');
  else if (state.dragX < -100) doSwipe('nope');
  else {
    if (top) {
      top.classList.add('animating');
      top.style.transform = `translate(0,0) rotate(0)`;
      top.style.opacity = 1;
      const like = top.querySelector('.stamp.like');
      const nope = top.querySelector('.stamp.nope');
      if (like) like.style.opacity = 0;
      if (nope) nope.style.opacity = 0;
      setTimeout(() => { if (top) top.classList.remove('animating'); }, 300);
    }
    state.dragX = 0; state.dragY = 0;
  }
}

window.addEventListener('mousemove', onMove);
window.addEventListener('mouseup', onEnd);
window.addEventListener('touchmove', onMove, { passive: false });
window.addEventListener('touchend', onEnd);

function doSwipe(action) {
  if (state.animating) return;
  state.animating = true;
  const top = stack.querySelector('.card.top');
  const current = TFGS[state.index];
  if (top) {
    top.classList.add('animating');
    const dir = action === 'like' ? 1 : -1;
    top.style.transform = `translate(${dir * 600}px, ${state.dragY}px) rotate(${dir * 30}deg)`;
    top.style.opacity = 0;
  }
  setTimeout(() => {
    if (action === 'like') {
      state.matches.push(current);
      showMatchPopup(current);
    } else {
      state.rejected.push(current);
    }
    state.index++;
    state.dragX = 0; state.dragY = 0;
    state.animating = false;
    render();
  }, 300);
}

function showMatchPopup(tfg) {
  const popup = document.createElement('div');
  popup.className = 'match-popup';
  popup.innerHTML = `
    <div class="match-box">
      <div class="match-emoji">💘</div>
      <div class="match-title">¡MATCH!</div>
      <div class="match-ref">${tfg.ref}</div>
    </div>
  `;
  stack.appendChild(popup);
  setTimeout(() => popup.remove(), 1500);
}

function renderFinished() {
  stack.innerHTML = `
    <div class="finished">
      <div class="trophy">🏆</div>
      <h2>¡Has terminado!</h2>
      <p>${state.matches.length} matches · ${state.rejected.length} descartes</p>
      ${state.matches.length > 0 ? `
        <div class="matches-list">
          <div class="matches-title">💖 TUS MATCHES</div>
          ${state.matches.map(m => `
            <div class="match-item">
              <div class="match-item-ref">${m.ref} · ${escapeHtml(m.ciudad)}</div>
              <div class="match-item-title">${escapeHtml(m.titulo)}</div>
            </div>
          `).join('')}
        </div>
      ` : ''}
      <button class="restart-btn" id="restartBtn">↻ EMPEZAR DE NUEVO</button>
    </div>
  `;
  document.getElementById('restartBtn').addEventListener('click', resetApp);
  counter.textContent = `${TFGS.length}/${TFGS.length}`;
  actions.classList.add('hidden');
  help.classList.add('hidden');
}

function resetApp() {
  state = { index: 0, matches: [], rejected: [], dragX: 0, dragY: 0, isDragging: false, startX: 0, startY: 0, animating: false };
  render();
}

document.getElementById('btnLike').addEventListener('click', () => doSwipe('like'));
document.getElementById('btnNope').addEventListener('click', () => doSwipe('nope'));
document.getElementById('btnReset').addEventListener('click', resetApp);

render();
</script>
</body>
</html>
